name: Build Google Play signed AAB (manual only)

on:
  workflow_dispatch:

# Builds an upload file. NEVER submits to Google Play automatically.
permissions:
  contents: read

jobs:
  signed-play-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-release
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Validate release inputs without exposing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" ||
                -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" || -z "$WEB_CLIENT_ID" ]]; then
            echo "::error::Missing Play upload key secrets or GOOGLE_WEB_CLIENT_ID variable."
            echo "Read play-store/RELEASE_CHECKLIST.md."
            exit 1
          fi
          if [[ "$WEB_CLIENT_ID" != *".apps.googleusercontent.com" ]]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID must be a Web OAuth client ID."
            exit 1
          fi
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode upload keystore into temporary private file
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oneshotgs-upload.jks"
          test -s "$RUNNER_TEMP/oneshotgs-upload.jks"
          echo "PLAY_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/oneshotgs-upload.jks" >> "$GITHUB_ENV"
      - name: Verify release source and run automated tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/play_release_preflight.py --source-check
          python3 -m unittest discover -s firebase -p 'test_*.py'
          python3 -m unittest discover -s tools -p 'test_*.py'
          gradle --no-daemon :app:testDebugUnitTest
      - name: Produce signed release AAB with real AdMob IDs
        shell: bash
        env:
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:bundleRelease "-PGOOGLE_WEB_CLIENT_ID=$WEB_CLIENT_ID"
          BUNDLE="app/build/outputs/bundle/release/app-release.aab"
          test -s "$BUNDLE"
          jarsigner -verify -verbose "$BUNDLE" >/dev/null
          sha256sum "$BUNDLE"
      - name: Export upload certificate (public certificate, NOT private key)
        shell: bash
        env:
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -exportcert -rfc \
            -keystore "$PLAY_UPLOAD_KEYSTORE_PATH" \
            -storepass "$PLAY_UPLOAD_STORE_PASSWORD" \
            -alias "$PLAY_UPLOAD_KEY_ALIAS" \
            -file "$RUNNER_TEMP/oneshotgs-upload-cert.pem"
          keytool -list -v \
            -keystore "$PLAY_UPLOAD_KEYSTORE_PATH" \
            -storepass "$PLAY_UPLOAD_STORE_PASSWORD" \
            -alias "$PLAY_UPLOAD_KEY_ALIAS" |
            grep -E 'SHA1:|SHA256:' > "$RUNNER_TEMP/upload-fingerprints.txt"
      - name: Upload signed Google Play AAB for owner's review
        uses: actions/upload-artifact@v4
        with:
          name: OneShotGS-Play-v1.0.0-SIGNED-AAB
          path: |
            app/build/outputs/bundle/release/app-release.aab
            ${{ runner.temp }}/oneshotgs-upload-cert.pem
            ${{ runner.temp }}/upload-fingerprints.txt
          if-no-files-found: error
          retention-days: 14
      - name: Delete temporary signing keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/oneshotgs-upload.jks"
