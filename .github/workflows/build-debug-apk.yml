name: Build Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'ui/modern-compose-refresh']

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Download project source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already includes Android command-line tools.
      # The third-party setup action was requesting the removed SDK package "tools".
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo "sdkmanager not found in $ANDROID_HOME"; exit 1; }
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Firebase Android config
        run: |
          python3 - <<'PY'
          import json
          obj=json.load(open("app/google-services.json"))
          assert obj["project_info"]["project_id"] == "bssc-cgl"
          assert any(x["client_info"]["android_client_info"]["package_name"] == "com.bssc.cgl4.free100mock" for x in obj["client"])
          print("Firebase project and Android package match")
          PY

      - name: Validate Firebase custom banner example (dry run)
        run: python3 firebase/manage_engagement.py --file firebase/engagement.example.json

      - name: Validate dynamic Home cards (dry run, no Firebase writes)
        run: python3 firebase/manage_home_cards.py --file firebase/home_cards.example.json

      - name: Test Firebase countdown and cutoff validation
        run: python3 -m unittest discover -s firebase -p 'test_*.py'

      - name: Audit bundled bilingual questions (warnings for repeats)
        run: python3 tools/audit_mock_bank.py

      - name: Test content-audit script
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Run access-policy unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      # Exercise the RELEASE manifest configuration without signing or distributing
      # a production build. Gradle verifies the real publisher, App ID and ad units.
      - name: Validate production AdMob manifest (no release published)
        run: gradle --no-daemon :app:processReleaseMainManifest

      - name: Build debug APK (Google test ads; bundled practice questions)
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build-log.txt

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BSSC-CGL4-Free-100-Mock-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish optional direct APK release (repository policy may deny releases)
        # GitHub Actions artifact above is the guaranteed fallback if Releases API is blocked.
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="phone-test-v29-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk#BSSC-CGL4-Free-100-Mock-TEST.apk" \
            --target "$GITHUB_SHA" \
            --title "BSSC CGL 4 Free Mock V29 Mandatory Registration - Phone Test APK (Run ${GITHUB_RUN_NUMBER})" \
            --notes "Unofficial V26: balanced centered bilingual login UI, student-entered name on first screen, consistent personalized greetings and profile. Existing ad slots preserved. Firebase login still requires owner activation. Flexible Firebase cards and OneShotGS remain. DEBUG uses demo ads only. For testing only. Install on your Android phone; not a Play Store release." \
            --prerelease
          echo "Direct APK link: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/BSSC-CGL4-Free-100-Mock-TEST.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BSSC-CGL4-BUILD-LOG
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 14
